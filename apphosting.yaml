# Settings for the Cloud Run service behind the App Hosting backend.
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  # Cloud Run sits behind the App Hosting proxy, which sets the public host. The Angular adapter only accepts this exact value.
  - variable: NG_TRUST_PROXY_HEADERS
    value: X-Forwarded-Host
    availability:
      - RUNTIME
