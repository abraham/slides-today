<mat-chip-listbox aria-label="Speaker selection" multiple>
  @for (speaker of speakers; track speaker.id) {
    <mat-chip-option
      [attr.data-id]="speaker.id"
      [selected]="selectedSpeakerIds().includes(speaker.id)"
      (selectionChange)="changeSelected($event, speaker.id)">
      <img matChipAvatar [src]="speaker.imageUrl" alt="" />
      {{ speaker.name }}
    </mat-chip-option>
  }
</mat-chip-listbox>
