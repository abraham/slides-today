<ng-template #content>
  @if (image()) {
    <div
      class="mdc-card__media mdc-card__media--square"
      [style.backgroundImage]="'url(' + image() + ')'"></div>
  }

  <div class="primary">
    <h2 class="hero mdc-typography mdc-typography--headline3">
      <ng-content select="[hero]" />
    </h2>
    <h3 class="title mdc-typography mdc-typography--headline6">
      <ng-content select="[title]" />
    </h3>
    <h4 class="subtitle mdc-typography mdc-typography--subtitle2">
      <ng-content select="[subtitle]" />
    </h4>
  </div>

  <section class="secondary mdc-typography mdc-typography--body2">
    <ng-content select="[body]" />
  </section>
</ng-template>

<div class="card mdc-card" [style]="theme()">
  @if (url() && external()) {
    <a
      class="mdc-card__primary-action primary-action"
      [href]="url()"
      target="_blank"
      rel="noopener"
      matRipple>
      <ng-container *ngTemplateOutlet="content" />
    </a>
  }

  @if (url() && !external()) {
    <a
      class="mdc-card__primary-action primary-action"
      [routerLink]="url()"
      matRipple>
      <ng-container *ngTemplateOutlet="content" />
    </a>
  }

  @if (!url()) {
    <div class="no-action">
      <ng-container *ngTemplateOutlet="content" />
    </div>
  }

  @if (actions().length) {
    <div class="mdc-card__actions">
      @for (action of actions(); track action.url) {
        <a mat-button [href]="action.url" target="_blank" rel="noopener">
          {{ action.title }}
        </a>
      }
    </div>
  }
</div>
