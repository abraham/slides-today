<ng-template #content>
  @if (image()) {
    <div class="media" [style.backgroundImage]="'url(' + image() + ')'"></div>
  }

  <div class="primary">
    <div class="hero" role="heading" [attr.aria-level]="heroLevel">
      <ng-content select="[hero]" />
    </div>
    <div class="title" role="heading" [attr.aria-level]="heroLevel + 1">
      <ng-content select="[title]" />
    </div>
    <div class="subtitle" role="heading" [attr.aria-level]="heroLevel + 2">
      <ng-content select="[subtitle]" />
    </div>
  </div>

  <section class="secondary">
    <ng-content select="[body]" />
  </section>
</ng-template>

<mat-card class="card" [style]="styles()">
  @if (url() && external()) {
    <a
      class="primary-action"
      [href]="url()"
      target="_blank"
      rel="noopener"
      matRipple>
      <ng-container *ngTemplateOutlet="content" />
    </a>
  }

  @if (url() && !external()) {
    <a class="primary-action" [routerLink]="url()" matRipple>
      <ng-container *ngTemplateOutlet="content" />
    </a>
  }

  @if (!url()) {
    <div class="no-action">
      <ng-container *ngTemplateOutlet="content" />
    </div>
  }

  @if (actions().length) {
    <mat-card-actions>
      @for (item of actionLinks(); track item.action.url) {
        @if (item.route) {
          <a mat-button [routerLink]="item.route">
            {{ item.action.title }}
          </a>
        } @else {
          <a mat-button [href]="item.action.url" target="_blank" rel="noopener">
            {{ item.action.title }}
          </a>
        }
      }
    </mat-card-actions>
  }
</mat-card>
