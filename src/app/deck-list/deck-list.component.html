<main id="main" class="main page" tabindex="-1">
  <div class="page-grid">
    <aside aria-label="Filters">
      @if (!mobile()) {
        <app-tag-chips />
        <app-speaker-chips />
        <app-event-chips />
      }
      @if (mobile()) {
        <button
          class="action-buttons"
          mat-stroked-button
          color="primary"
          (click)="openFiltersSheet()">
          <mat-icon fontSet="material-symbols-outlined">filter_list</mat-icon>
          Filters
        </button>
      }
    </aside>
    <div>
      <div class="page-grid">
        @if (!hasSelectedFilters()) {
          <app-about />
        }

        @for (deck of decks(); track deck.id) {
          <app-deck-summary [deck]="deck" />
        }
        @if (decks()?.length === 0) {
          <div class="decks-empty">
            Nothing found that includes all the following filters:
            {{ selectedFilters() }}
          </div>
        }
      </div>
    </div>
  </div>
</main>
