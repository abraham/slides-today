<main class="main page">
  <div class="page-grid">
    <div>
      @if (!mobile()) {
        <app-tags />
      }
      @if (mobile()) {
        <button
          class="action-buttons"
          mat-stroked-button
          color="primary"
          (click)="openTagsSheet()">
          <mat-icon fontSet="material-symbols-outlined">filter_list</mat-icon>
          Tags
        </button>
      }
    </div>
    <div>
      <div class="page-grid">
        @if (!hasSelectedFilters()) {
          <app-about />
        }

        @for (deck of decks(); track deck.id) {
          <app-deck-summary [deck]="deck" />
        }
        @if (decks()?.length === 0) {
          <div class="decks-empty">
            Nothing found that includes all the following tags:
            {{ selectedTagIds() | tagList }}
          </div>
        }
      </div>
    </div>
  </div>
</main>
