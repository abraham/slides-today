<app-card>
  <div title>Sponsors</div>
  <mat-nav-list body>
    @for (sponsor of sponsors(); track sponsor.id) {
      <a mat-list-item [href]="sponsor.url" target="_blank" rel="noopener">
        <img
          matListItemAvatar
          [src]="sponsor.image"
          [attr.alt]="sponsor.name + ' logo'" />
        <h3 matListItemTitle>{{ sponsor.name }}</h3>
        <p matListItemLine>
          <span>{{ sponsor.description }}</span>
        </p>
      </a>
    }
  </mat-nav-list>
</app-card>
