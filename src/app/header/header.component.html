<mat-toolbar [class.scrolled]="!atTop()">
  <section>
    @if (showBack()) {
      <a mat-button (click)="goBack($event)" href="/">
        <mat-icon fontSet="material-symbols-outlined">arrow_back</mat-icon>
        Back
      </a>
    }
    @if (title()) {
      <h1>{{ title() }}</h1>
    }
  </section>
  <span class="spacer"></span>
  <section>
    @if (updateAvailable()) {
      <button
        (click)="reload()"
        mat-icon-button
        aria-label="Update Slides.today"
        title="Update Slides.today"
        class="spin">
        <mat-icon fontSet="material-symbols-outlined" fontIcon="update" />
      </button>
    }
    @if (deferredInstallPrompt()) {
      <button
        (click)="openInstallPrompt()"
        mat-icon-button
        aria-label="Install Slides.today"
        title="Install Slides.today"
        class="wiggle">
        <mat-icon
          fontSet="material-symbols-outlined"
          fontIcon="install_mobile" />
      </button>
    }
  </section>
</mat-toolbar>
